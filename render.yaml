services:
  - type: web
    name: vera-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false   # You'll set this in Render dashboard
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBER
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: PORT
        value: "8080"
    healthCheckPath: /v1/healthz
